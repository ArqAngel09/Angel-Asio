name: Windows build
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: microsoft/setup-msbuild@v2

      - uses: lukka/get-cmake@latest

      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Locate executable and prepare artifact
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path build -Filter "UltraASIOLab.exe" -Recurse -File | Select-Object -First 1
          if (-not $exe) {
            Write-Host "No se encontró UltraASIOLab.exe. Archivos generados:"
            Get-ChildItem -Path build -Recurse -File | Select-Object -ExpandProperty FullName
            throw "La compilación terminó, pero no se encontró UltraASIOLab.exe."
          }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item $exe.FullName "dist/UltraASIOLab.exe" -Force
          Write-Host "Ejecutable preparado: dist/UltraASIOLab.exe"

      - name: Upload Windows x64 executable
        uses: actions/upload-artifact@v4
        with:
          name: UltraASIOLab-Windows-x64
          path: dist/UltraASIOLab.exe
          if-no-files-found: error
